<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,500;0,600;0,700;1,600&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>:root { --brand: #791e01; }</style>
  <style>
 
:root {
  --brand-700: color-mix(in srgb, var(--brand) 82%, black);
  --brand-100: color-mix(in srgb, var(--brand) 14%, white);
  --brand-50:  color-mix(in srgb, var(--brand) 6%, white);
  --bg: #faf7f5;
  --surface: #ffffff;
  --ink: #1d1714;
  --ink-2: #4a403b;
  --muted: #7a6f6a;
  --line: #ebe3df;
  --line-2: #f3eeeb;
  --ok: #2f7a4f;
  --ok-bg: #e8f3ec;
  --warn: #9a5b00;
  --warn-bg: #fdf3e2;
  --err: #b42318;
  --err-bg: #fdecea;
  --lock: #9b918c;
  --lock-bg: #f2eeec;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(29,23,20,.05), 0 6px 20px rgba(29,23,20,.05);
  --shadow-lg: 0 12px 40px rgba(29,23,20,.16);
  --serif: 'Faustina', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.2; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }

 
.boot { min-height: 100vh; display: grid; place-items: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--brand-100); border-top-color: var(--brand); animation: spin .8s linear infinite; }
.spinner.sm { width: 18px; height: 18px; border-width: 2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading { padding: 80px 0; display: grid; place-items: center; gap: 12px; color: var(--muted); }

 
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; white-space: nowrap; }
.btn:focus-visible { outline: 3px solid var(--brand-100); outline-offset: 1px; }
.btn-primary { background: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-700); }
.btn-ghost { background: transparent; color: var(--ink-2); border-color: var(--line); }
.btn-ghost:hover { background: var(--line-2); }
.btn-soft { background: var(--brand-50); color: var(--brand); border-color: var(--brand-100); }
.btn-soft:hover { background: var(--brand-100); }
.btn-ok { background: var(--ok); color: #fff; }
.btn[disabled], .btn.disabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn-lg { padding: 14px 24px; font-size: 15px; border-radius: 12px; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-link { background: none; border: none; color: var(--brand); padding: 0; font-weight: 600; cursor: pointer; }

 
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 11px 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }
textarea.input { min-height: 120px; resize: vertical; }
.alert { border-radius: 10px; padding: 11px 14px; font-size: 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
.alert-err { background: var(--err-bg); color: var(--err); }
.alert-ok { background: var(--ok-bg); color: var(--ok); }
.alert-info { background: var(--brand-50); color: var(--brand-700); }
.alert-warn { background: var(--warn-bg); color: var(--warn); }

 
.login { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }
.login-brand { background: var(--brand); color: #fff; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.login-brand::after { content: ''; position: absolute; right: -120px; bottom: -120px; width: 380px; height: 380px; border-radius: 50%; border: 60px solid rgba(255,255,255,.06); }
.login-brand img { height: 46px; width: auto; align-self: flex-start; }
.login-brand h1 { font-size: 44px; margin: 0 0 14px; color: #fff; }
.login-brand p { color: rgba(255,255,255,.82); max-width: 420px; margin: 0; font-size: 16px; }
.flow { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; letter-spacing: .08em; font-weight: 600; color: rgba(255,255,255,.75); margin-top: 28px; }
.flow b { color: #fff; font-weight: 700; }
.login-form { display: grid; place-items: center; padding: 40px 24px; }
.login-card { width: 100%; max-width: 400px; }
.login-card h2 { font-size: 28px; margin-bottom: 6px; }
.login-links { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 16px; font-size: 14px; }
.tabs { display: flex; gap: 4px; background: var(--line-2); padding: 4px; border-radius: 12px; margin: 22px 0 22px; }
.tabs button { flex: 1; border: none; background: none; padding: 9px 10px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; }
.tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

 
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.4) blur(8px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1160px; margin: 0 auto; padding: 0 24px; height: 68px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); cursor: pointer; }
.brand img { height: 30px; width: auto; display: block; }
.brand .sep { width: 1px; height: 26px; background: var(--line); }
.brand .nm { font-weight: 600; font-size: 14px; line-height: 1.2; }
.brand .nm small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
.nav { display: flex; gap: 2px; margin-left: 10px; }
.nav button { border: none; background: none; padding: 8px 12px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
.nav button:hover { color: var(--ink); background: var(--line-2); }
.nav button.on { color: var(--brand); background: var(--brand-50); }
.spacer { flex: 1; }
.me { display: flex; align-items: center; gap: 12px; position: relative; }
.me-btn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: #fff; border-radius: 40px; padding: 4px 12px 4px 4px; cursor: pointer; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.me-txt { text-align: left; line-height: 1.15; }
.me-txt b { font-size: 13px; display: block; }
.me-txt span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); min-width: 220px; padding: 6px; z-index: 30; }
.menu button { width: 100%; display: flex; gap: 10px; align-items: center; border: none; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; }
.menu button:hover { background: var(--line-2); }
.head-prog { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
main.page { max-width: 1160px; margin: 0 auto; padding: 32px 24px 80px; }
.mobile-nav { display: none; }

 
.ring { --p: 0; --sz: 44px; --th: 5px; width: var(--sz); height: var(--sz); border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--brand-100) 0); position: relative; flex: none; }
.ring::before { content: ''; position: absolute; inset: var(--th); border-radius: 50%; background: #fff; }
.ring span { position: relative; font-weight: 700; font-size: calc(var(--sz) * .26); }

 
.hello h1 { font-size: 38px; }
.hello p { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(4, 1fr); margin: 28px 0 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; min-height: 124px; }
.kpi .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--muted); }
.kpi .val { font-family: var(--serif); font-size: 34px; font-weight: 600; line-height: 1; }
.kpi .val small { font-family: var(--sans); font-size: 14px; color: var(--muted); font-weight: 500; }
.kpi .sub { font-size: 13px; color: var(--muted); }
.kpi-row { display: flex; align-items: center; gap: 14px; }
.bar { height: 8px; background: var(--brand-100); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .6s ease; }
.bar.ok > i { background: var(--ok); }
.continue { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 26px 28px; background: linear-gradient(120deg, var(--brand) 0%, var(--brand-700) 100%); color: #fff; border: none; border-radius: 18px; }
.continue .eyebrow { color: rgba(255,255,255,.7); }
.continue h2 { font-size: 28px; color: #fff; margin: 6px 0 6px; }
.continue p { margin: 0; color: rgba(255,255,255,.82); max-width: 640px; }
.continue .btn { background: #fff; color: var(--brand); }
.continue .btn:hover { background: var(--brand-50); }
.continue .bar { background: rgba(255,255,255,.2); margin-top: 16px; max-width: 420px; }
.continue .bar > i { background: #fff; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--brand); }
.two { grid-template-columns: 1.4fr 1fr; margin-top: 20px; }
.panel { padding: 22px 24px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
.panel-h h3 { font-size: 20px; }
.mini-list { display: grid; gap: 10px; }
.mini { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-2); cursor: pointer; background: #fff; text-align: left; width: 100%; }
.mini:hover { border-color: var(--line); background: var(--bg); }
.mini .t { flex: 1; min-width: 0; }
.mini .t b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .t span { font-size: 12px; color: var(--muted); }

 
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; white-space: nowrap; }
.pill svg.i { width: 13px; height: 13px; stroke-width: 2.4; }
.s-CONCLUIDO { background: var(--ok-bg); color: var(--ok); }
.s-EM_ANDAMENTO { background: var(--brand-100); color: var(--brand-700); }
.s-DISPONIVEL { background: #fff; color: var(--brand); box-shadow: inset 0 0 0 1.5px var(--brand); }
.s-BLOQUEADO { background: var(--lock-bg); color: var(--lock); }
.s-EM_BREVE { background: var(--lock-bg); color: var(--lock); }
.s-PENDENTE_AVALIACAO, .s-REVISAR { background: var(--warn-bg); color: var(--warn); }
.dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.dot.s-CONCLUIDO { background: var(--ok); color: #fff; }
.dot.s-EM_ANDAMENTO { background: var(--brand); color: #fff; }
.dot.s-DISPONIVEL { background: #fff; color: var(--brand); box-shadow: inset 0 0 0 2px var(--brand); }
.dot.s-BLOQUEADO, .dot.s-EM_BREVE { background: var(--lock-bg); color: var(--lock); }

 
.trail-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 26px; flex-wrap: wrap; }
.trail-head h1 { font-size: 34px; margin-top: 6px; }
.trail-head p { margin: 8px 0 0; color: var(--muted); max-width: 640px; }
.trail-prog { min-width: 260px; }
.trail-prog .row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
.trail { position: relative; display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 56px 1fr; gap: 18px; position: relative; }
.step .rail { display: flex; flex-direction: column; align-items: center; }
.step .rail .dot { width: 44px; height: 44px; margin-top: 18px; z-index: 1; }
.step .rail .dot svg.i { width: 20px; height: 20px; }
.step .rail .ln { flex: 1; width: 2px; background: var(--line); margin: 4px 0 -18px; }
.step.done .rail .ln { background: var(--ok); }
.step:last-child .rail .ln { display: none; }
.tcard { padding: 20px 22px; margin-bottom: 16px; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; transition: border-color .15s, transform .15s; }
.tcard.clicavel { cursor: pointer; }
.tcard.clicavel:hover { border-color: color-mix(in srgb, var(--brand) 35%, white); }
.tcard.lock { background: #fcfbfa; box-shadow: none; }
.tcard.lock h3 { color: var(--ink-2); }
.tcard .num { font-size: 12px; letter-spacing: .08em; font-weight: 700; color: var(--muted); text-transform: uppercase; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tcard h3 { font-size: 22px; margin: 6px 0 4px; }
.tcard p { margin: 0; color: var(--muted); font-size: 14px; max-width: 640px; }
.meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg.i { width: 15px; height: 15px; }
.tcard .side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; min-width: 150px; }
.tcard .side .bar { width: 150px; }
.finish .dot { background: var(--lock-bg); color: var(--lock); }
.finish.on .dot { background: #c9a227; color: #fff; }
.finish .tcard { grid-template-columns: 1fr; }
.trail-sep { margin: 40px 0 20px; }

 
.crumb { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 18px; flex-wrap: wrap; }
.crumb button { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0; font-weight: 600; }
.crumb button:hover { color: var(--brand); }
.t-hero { padding: 28px 30px; display: grid; grid-template-columns: 1fr 240px; gap: 28px; align-items: center; }
.t-hero h1 { font-size: 36px; margin: 8px 0 4px; }
.t-hero .subt { color: var(--muted); font-size: 16px; margin: 0; }
.t-hero .desc { margin: 14px 0 0; color: var(--ink-2); }
.t-prog { text-align: center; display: grid; justify-items: center; gap: 10px; }
.t-prog .ring { --sz: 104px; --th: 9px; }
.t-grid { display: grid; grid-template-columns: 1fr 320px; gap: 20px; margin-top: 20px; align-items: start; }
.box { padding: 18px 20px; }
.box h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.box p { margin: 0; color: var(--ink-2); font-size: 14px; }
.sticky { position: sticky; top: 88px; display: grid; gap: 16px; }
.items { display: grid; gap: 12px; }
.item { overflow: hidden; }
.item-h { display: flex; gap: 14px; align-items: center; padding: 16px 18px; cursor: pointer; width: 100%; border: none; background: none; text-align: left; }
.item-h:hover { background: var(--bg); }
.item-ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-50); color: var(--brand); flex: none; }
.item.ok .item-ic { background: var(--ok-bg); color: var(--ok); }
.item-t { flex: 1; min-width: 0; }
.item-t b { display: block; font-size: 15px; }
.item-t span { font-size: 13px; color: var(--muted); }
.item-t .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; color: var(--muted); }
.chev { transition: transform .2s; color: var(--muted); }
.item.open .chev { transform: rotate(180deg); }
.item-b { border-top: 1px solid var(--line-2); padding: 20px 22px; display: none; }
.item.open .item-b { display: block; }
.embed { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #111; aspect-ratio: 16 / 9; }
.embed.doc { aspect-ratio: auto; height: 560px; background: #f4f1ef; }
.embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.prose { font-size: 16px; line-height: 1.7; color: var(--ink-2); max-width: 720px; }
.prose p { margin: 0 0 14px; }
.prose ul { margin: 0 0 16px; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.prose li { position: relative; padding-left: 26px; }
.prose li::before { content: '→'; position: absolute; left: 0; color: var(--brand); font-weight: 700; }
.prose strong { color: var(--ink); }
.prose .h { font-family: var(--serif); font-size: 20px; color: var(--brand); font-weight: 600; margin: 20px 0 8px; }
.prose .h:first-child { margin-top: 0; }
.item-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
.done-note { display: inline-flex; gap: 8px; align-items: center; color: var(--ok); font-weight: 600; font-size: 14px; }
.conclude { padding: 22px; text-align: center; display: grid; gap: 12px; }
.conclude p { margin: 0; font-size: 13px; color: var(--muted); }
.quiz-card { padding: 20px; display: grid; gap: 12px; }
.quiz-card .score { font-family: var(--serif); font-size: 30px; font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; }

 
.blocked { max-width: 560px; margin: 40px auto; text-align: center; padding: 44px 36px; }
.blocked .big { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 18px; background: var(--lock-bg); color: var(--lock); }
.blocked .big svg.i { width: 34px; height: 34px; }
.blocked h1 { font-size: 30px; margin-bottom: 10px; }
.blocked ul { text-align: left; display: inline-grid; gap: 6px; padding: 14px 18px 14px 36px; background: var(--bg); border-radius: 10px; font-size: 14px; }

 
.quiz { max-width: 780px; margin: 0 auto; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.q { padding: 22px 24px; margin: 0 0 14px; min-width: 0; display: block; width: 100%; }
.q .qn { font-size: 12px; font-weight: 700; letter-spacing: .08em; color: var(--brand); text-transform: uppercase; }
.q h3 { font-family: var(--sans); font-size: 17px; font-weight: 600; margin: 6px 0 14px; line-height: 1.45; }
.opt { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 11px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color .12s, background .12s; }
.opt:hover { border-color: color-mix(in srgb, var(--brand) 40%, white); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .l { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--muted); flex: none; }
.opt.sel { border-color: var(--brand); background: var(--brand-50); }
.opt.sel .l { background: var(--brand); border-color: var(--brand); color: #fff; }
.q.certa { border-color: #bfdcc9; }
.q.errada { border-color: #f1c4bf; }
.q .mark { float: right; }
.quiz-foot { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 20px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.result { text-align: center; padding: 40px 32px; margin-bottom: 20px; }
.result .ring { --sz: 132px; --th: 11px; margin: 0 auto 16px; }
.result.ok .ring { background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--ok-bg) 0); }
.result h2 { font-size: 30px; }

 
.overlay { position: fixed; inset: 0; background: rgba(29,23,20,.45); display: grid; place-items: center; z-index: 60; padding: 20px; animation: fade .15s; }
.modal { background: #fff; border-radius: 18px; box-shadow: var(--shadow-lg); width: 100%; max-width: 460px; padding: 30px; animation: pop .2s ease; max-height: 90vh; overflow: auto; }
.modal.wide { max-width: 640px; }
.modal h2 { font-size: 26px; margin-bottom: 8px; }

  function nomePerfil(p) { return { ADMINISTRADOR: 'Administrador', GESTOR: 'Gestor', COLABORADOR: 'Colaborador' }[p] || 'Colaborador'; }

  function telaLogin(aba, msg, enviado) {

    var titulos = { entrar: 'Bem-vindo(a)', cadastro: 'Primeiro acesso', esqueci: 'Esqueci minha senha', enviado: 'Solicitação enviada' };

        '<div class="field"><label for="c-nome">Nome completo</label><input class="input" id="c-nome" autocomplete="name" required minlength="3"></div>' +

        '<div class="field"><label for="c-s2">Confirme a senha</label><input class="input" id="c-s2" type="password" autocomplete="new-password" required minlength="6"></div>' +
        '<button class="btn btn-primary btn-lg" style="width:100%" type="submit">Solicitar acesso</button>' +
        '<div class="login-links"><button type="button" class="btn-link" data-aba="entrar">Já tenho cadastro — entrar</button></div></form>';
    } else if (aba === 'esqueci') {
      corpo = '<form id="f-esqueci" autocomplete="on">' +
        '<div class="field"><label for="e-email">E-mail cadastrado</label><input class="input" id="e-email" type="email" autocomplete="username" required></div>' +
        '<div class="field"><label for="e-s1">Nova senha (mín. 6 caracteres)</label><input class="input" id="e-s1" type="password" autocomplete="new-password" required minlength="6"></div>' +
        '<div class="field"><label for="e-s2">Confirme a nova senha</label><input class="input" id="e-s2" type="password" autocomplete="new-password" required minlength="6"></div>' +

        '<div class="login-links"><button type="button" class="btn-link" data-aba="entrar">Voltar para o login</button></div></form>';
    } else {
      corpo = '<div class="alert alert-ok">' + ic('check') + '<div>' + (enviado === 'esqueci'
        ? '<b>Pedido de nova senha enviado.</b><br>Assim que um administrador aprovar, entre com o e-mail e a nova senha. Até lá, a senha anterior continua valendo.'
        : '<b>Cadastro enviado para aprovação.</b><br>Assim que um administrador aprovar, entre com o e-mail e a senha que você acabou de criar.') + '</div></div>' +
        '<button class="btn btn-primary btn-lg" style="width:100%" data-aba="entrar">Voltar para o login</button>';

    $$('[data-aba]').forEach(function (b) { b.addEventListener('click', function () { telaLogin(b.getAttribute('data-aba')); }); });

    var fl = $('#f-login');

        var btn = $('button[type=submit]', fc);
        ocupado(btn, chamar('apiSolicitarCadastro', [$('#c-nome').value, $('#c-email').value, $('#c-dep').value, $('#c-s1').value], false))
          .then(function (d) {
            if (d && d.token) { toast('Acesso criado! Bem-vindo(a) ao Hub.', 'ok'); entrou(d); }
            else telaLogin('enviado', '', 'cadastro');

      });

    var fe = $('#f-esqueci');

  function entrou(d) {
    S.token = d.token;

    carregando($('#app'), 'Preparando sua trilha…');

  }

  function sairLocal(msg) {

  function sair() {
    var t = S.token;

    chamar('apiLogout', [t], false).catch(function () {});
  }

  function trocarSenha() {
    var m = modal('<h2>Trocar senha</h2><p class="muted" style="margin-top:0">Escolha uma nova senha com pelo menos 6 caracteres.</p>' +
      '<div id="ts-msg"></div>' +
      '<div class="field"><label>Senha atual</label><input class="input" type="password" id="ts-a" autocomplete="current-password"></div>' +
      '<div class="field"><label>Nova senha</label><input class="input" type="password" id="ts-n" autocomplete="new-password"></div>' +
      '<div class="field"><label>Confirme a nova senha</label><input class="input" type="password" id="ts-c" autocomplete="new-password"></div>' +
      '<div class="acts"><button class="btn btn-ghost" data-fechar>Cancelar</button><button class="btn btn-primary" id="ts-ok">Salvar</button></div>');
    $('#ts-ok', m).addEventListener('click', function () {
      var n = $('#ts-n', m).value;
      if (n !== $('#ts-c', m).value) { $('#ts-msg', m).innerHTML = '<div class="alert alert-err">As senhas não conferem.</div>'; return; }
      ocupado(this, api('apiTrocarSenha', $('#ts-a', m).value, n)).then(function () { fecharModal(); toast('Senha alterada.', 'ok'); },
        function (e) { $('#ts-msg', m).innerHTML = '<div class="alert alert-err">' + esc(e.message) + '</div>'; });
    });
  }

  
  function iniciar() {
    document.addEventListener('click', function () { var m = $('#me-menu'); if (m) m.classList.add('hidden'); });
    try {
      google.script.history.setChangeHandler(function (e) {
        if (e && e.state && e.state.rota && S.token) ir(e.state.rota, true);
      });
    } catch (e) {}
    var t = lerToken();
    if (!t) return telaLogin();
    S.token = t;
    atualizarPainel().then(function () {
      var inicial = 'inicio';
      try { google.script.url.getLocation(function (loc) { if (loc && loc.hash) inicial = loc.hash; ir(inicial, true); }); }
      catch (e) { ir(inicial, true); }
    }, function (e) { if (S.token) sairLocal(e.message); });
  }

  return {
    S: S, esc: esc, md: md, ic: ic, $: $, $$: $$, pill: pill, ring: ring, barra: barra, toast: toast, modal: modal,
    fecharModal: fecharModal, ocupado: ocupado, api: api, ir: ir, registrar: registrar, renderizar: renderizar,
    carregando: carregando, erroNaTela: erroNaTela, atualizarPainel: atualizarPainel, iniciar: iniciar,

  <script>


(function (H) {
  var esc = H.esc, ic = H.ic, $ = H.$, $$ = H.$$;

  function meta(t) {
    var m = [];
    if (t.cargaHoraria) m.push('<span>' + ic('clock') + esc(t.cargaHoraria) + '</span>');
    if (t.nivel) m.push('<span>' + ic('layers') + esc(t.nivel) + '</span>');
    if (t.conteudosTotal) m.push('<span>' + ic('task') + t.conteudosFeitos + ' de ' + t.conteudosTotal + ' itens</span>');
    if (t.nota !== null && t.nota !== undefined) m.push('<span>' + ic('target') + 'Nota ' + t.nota + '%</span>');
    if (t.dataConclusao) m.push('<span>' + ic('check') + 'Concluído em ' + esc(t.dataConclusao) + '</span>');
    return m.length ? '<div class="meta">' + m.join('') + '</div>' : '';
  }
  function rotuloBotao(s) {
    return { DISPONIVEL: 'Começar', EM_ANDAMENTO: 'Continuar', CONCLUIDO: 'Revisar', BLOQUEADO: 'Bloqueado', EM_BREVE: 'Em breve' }[s] || 'Acessar';
  }
  function liberado(s) { return s === 'DISPONIVEL' || s === 'EM_ANDAMENTO' || s === 'CONCLUIDO'; }

  
  H.registrar('inicio', function (el) {
    function desenhar() {
      var S = H.S, p = S.painel, u = S.usuario, ind = p.indicadores;
      var atual = ind.atual, prox = ind.proximo;
      var html = '<section class="hello"><h1>Olá, ' + esc(u.primeiroNome) + '!</h1><p>' + esc(S.config.mensagemBoasVindas) + '</p></section>';

      html += '<div class="grid kpis">' +
        '<div class="card kpi"><div class="lbl">Progresso geral</div><div class="kpi-row"><div class="ring" style="--p:' + ind.percentualGeral + ';--sz:58px;--th:7px"><span>' + ind.percentualGeral + '%</span></div>' +
          '<div class="sub">dos treinamentos obrigatórios</div></div></div>' +
        '<div class="card kpi"><div class="lbl">Concluídos</div><div class="val">' + ind.concluidos + ' <small>de ' + ind.total + '</small></div>' + H.barra(ind.percentualGeral, 'ok') + '</div>' +
        '<div class="card kpi"><div class="lbl">Treinamento atual</div>' +
          (atual ? '<div style="font-weight:600;font-size:15px;line-height:1.35">' + esc(atual.titulo) + '</div><div class="sub">Treinamento ' + esc(atual.numero) + ' · ' + atual.percentual + '%</div>'
                 : '<div class="sub">Nenhum treinamento em aberto</div>') + '</div>' +
        '<div class="card kpi"><div class="lbl">Próximo treinamento</div>' +
          (prox ? '<div style="font-weight:600;font-size:15px;line-height:1.35">' + esc(prox.titulo) + '</div><div>' + H.pill(prox.status) + '</div>'
                : '<div class="sub">Você está em dia 🎉</div>') + '</div>' +
      '</div>';

      if (atual) {
        html += '<section class="card continue"><div>' +
          '<div class="eyebrow">' + (atual.status === 'EM_ANDAMENTO' ? 'Continue de onde parou' : 'Seu próximo passo') + ' · Treinamento ' + esc(atual.numero) + '</div>' +
          '<h2>' + esc(atual.titulo) + '</h2><p>' + esc(atual.descricao || atual.subtitulo) + '</p>' +
          H.barra(atual.percentual) + '</div>' +
          '<button class="btn btn-lg" data-t="' + esc(atual.id) + '">' + (atual.status === 'EM_ANDAMENTO' ? 'Continuar' : 'Começar agora') + ic('right') + '</button></section>';
      } else if (ind.total && ind.concluidos === ind.total) {
        html += '<section class="card continue"><div><div class="eyebrow">' + ic('trophy') + ' Trilha concluída</div><h2>Parabéns!</h2><p>' +
          esc(S.config.mensagemConclusaoTrilha) + '</p></div></section>';
      } else {
        html += '<section class="card continue"><div><div class="eyebrow">Tudo em dia</div><h2>Novos treinamentos em breve</h2>' +
          '<p>Você concluiu tudo o que está liberado. Assim que o próximo treinamento for publicado, ele aparecerá aqui.</p></div></section>';
      }

      html += '<div class="grid two">';
      p.trilhas.forEach(function (tr, i) {
        if (i > 0) return;
        html += '<section class="card panel"><div class="panel-h"><h3>' + esc(tr.nome) + '</h3><button class="btn btn-sm btn-ghost" data-ir-trilha>Ver trilha' + ic('right') + '</button></div><div class="mini-list">' +
          tr.treinamentos.map(function (t) {
            return '<button class="mini" ' + (liberado(t.status) ? 'data-t="' + esc(t.id) + '"' : 'data-ir-trilha') + '>' +
              '<span class="dot s-' + t.status + '" style="width:30px;height:30px">' + ic({ CONCLUIDO: 'check', EM_ANDAMENTO: 'play', DISPONIVEL: 'right', BLOQUEADO: 'lock', EM_BREVE: 'clock' }[t.status]) + '</span>' +
              '<span class="t"><b>Treinamento ' + esc(t.numero) + ' — ' + esc(t.titulo) + '</b><span>' + esc(H.NOME_STATUS[t.status]) + (liberado(t.status) ? ' · ' + t.percentual + '%' : '') + '</span></span>' + ic('right', 'chev') + '</button>';
          }).join('') + '</div></section>';
      });
      html += '<section class="card panel"><div class="panel-h"><h3>Percentual por trilha</h3></div>' +
        (p.trilhas.length ? p.trilhas.map(function (tr) {
          return '<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;gap:10px"><span>' + esc(tr.nome) +
            '</span><span>' + tr.percentual + '%</span></div>' + H.barra(tr.percentual, tr.concluida ? 'ok' : '') +
            '<div class="muted small" style="margin-top:4px">' + tr.concluidos + ' de ' + tr.total + ' treinamentos' + (tr.emBreve ? ' · ' + tr.emBreve + ' em breve' : '') + '</div></div>';
        }).join('') : '<p class="muted">Nenhuma trilha atribuída ao seu perfil ainda.</p>') + '</section></div>';

      el.innerHTML = html;
      $$('[data-t]', el).forEach(function (b) { b.addEventListener('click', function () { H.ir('treinamento/' + b.getAttribute('data-t')); }); });
      $$('[data-ir-trilha]', el).forEach(function (b) { b.addEventListener('click', function () { H.ir('trilha'); }); });
    }
    if (H.S.painel) desenhar(); else H.carregando(el);
    H.atualizarPainel().then(function () { if (H.S.rota === 'inicio' || !H.S.rota) { desenhar(); atualizarAnel(); } }, function (e) { if (!H.S.painel) H.erroNaTela(el, e, function () { H.ir('inicio'); }); });
  });

  function atualizarAnel() {
    var r = document.querySelector('.head-prog .ring');
    if (r && H.S.painel) { var p = H.S.painel.indicadores.percentualGeral; r.style.setProperty('--p', p); r.querySelector('span').textContent = p; }
  }

  
  H.registrar('trilha', function (el) {
    function desenhar() {
      var p = H.S.painel;
      if (!p.trilhas.length) { el.innerHTML = '<div class="card empty">Nenhuma trilha atribuída ao seu perfil ainda.</div>'; return; }
      el.innerHTML = p.trilhas.map(function (tr, idx) {
        return '<section class="' + (idx ? 'trail-sep' : '') + '"><div class="trail-head"><div><div class="eyebrow">Trilha de aprendizagem</div><h1>' + esc(tr.nome) + '</h1>' +
          (tr.descricao ? '<p>' + esc(tr.descricao) + '</p>' : '') + '</div>' +
          '<div class="trail-prog"><div class="row"><span>' + tr.concluidos + ' de ' + tr.total + ' concluídos</span><span>' + tr.percentual + '%</span></div>' + H.barra(tr.percentual, tr.concluida ? 'ok' : '') + '</div></div>' +
          '<div class="trail">' + tr.treinamentos.map(function (t) {
            var ok = liberado(t.status);
            return '<div class="step ' + (t.status === 'CONCLUIDO' ? 'done' : '') + '"><div class="rail"><span class="dot s-' + t.status + '">' +
              ic({ CONCLUIDO: 'check', EM_ANDAMENTO: 'play', DISPONIVEL: 'right', BLOQUEADO: 'lock', EM_BREVE: 'clock' }[t.status]) + '</span><span class="ln"></span></div>' +
              '<article class="card tcard ' + (ok ? 'clicavel' : 'lock') + '" ' + (ok ? 'data-t="' + esc(t.id) + '" tabindex="0"' : '') + '>' +
                '<div><div class="num">Treinamento ' + esc(t.numero) + (t.obrigatorio ? '' : ' · Complementar') + ' ' + H.pill(t.status) + '</div>' +
                '<h3>' + esc(t.titulo) + '</h3>' + (t.descricao ? '<p>' + esc(t.descricao) + '</p>' : '') + meta(t) +
                (t.status === 'BLOQUEADO' && t.motivo ? '<div class="muted small" style="margin-top:10px">' + ic('lock') + ' ' + esc(t.motivo) + '</div>' : '') + '</div>' +
                '<div class="side">' + (ok ? H.barra(t.percentual, t.status === 'CONCLUIDO' ? 'ok' : '') + '<span class="muted small">' + t.percentual + '% concluído</span>' : '') +
                  '<button class="btn ' + (ok ? (t.status === 'CONCLUIDO' ? 'btn-ghost' : 'btn-primary') : 'btn-ghost disabled') + '" ' + (ok ? '' : 'disabled') + '>' +
                  (ok ? '' : ic(t.status === 'EM_BREVE' ? 'clock' : 'lock')) + rotuloBotao(t.status) + (ok ? ic('right') : '') + '</button></div>' +
              '</article></div>';
          }).join('') +
          '<div class="step finish ' + (tr.concluida ? 'on' : '') + '"><div class="rail"><span class="dot">' + ic('trophy') + '</span></div>' +
            '<article class="card tcard lock"><div><div class="num">Conclusão da trilha</div><h3>' + (tr.concluida ? 'Trilha concluída!' : 'Complete todos os treinamentos') + '</h3>' +
            '<p>' + (tr.concluida ? esc(H.S.config.mensagemConclusaoTrilha) : 'Conclua os treinamentos obrigatórios para completar esta trilha.') + '</p></div></article></div>' +

      $$('[data-voltar]', el).forEach(function (b) { b.addEventListener('click', function () { H.ir('treinamento/' + id); }); });
      var dn = $('#bt-de-novo', el); if (dn) dn.addEventListener('click', function () { H.carregando(el); iniciar(); window.scrollTo(0, 0); });
      if (resultado) return;
      $$('.opt input', el).forEach(function (inp) {
        inp.addEventListener('change', function () {
          resp[inp.name.substring(2)] = inp.value;
          $$('input[name="' + inp.name + '"]', el).forEach(function (o) { o.closest('.opt').classList.toggle('sel', o.checked); });
          $('#q-cont', el).textContent = contagem() + ' de ' + Q.perguntas.length + ' respondidas';
        });

      $('#bt-enviar', el).addEventListener('click', function () {

          '<div class="acts"><button class="btn btn-ghost" data-fechar>Revisar</button><button class="btn btn-primary" id="cf-ok">Enviar</button></div>');

    }
  });
})(Hub);

  <script>

  function lista(pessoas, vazio) {

    return '<div class="people">' + pessoas.slice(0, 40).map(function (p) { return '<span class="chip" title="' + esc(p.departamento) + '">' + esc(p.nome) + '</span>'; }).join('') +

  function visao(el) {

                (d.maisConcluido && d.maisConcluido.concluidos ? esc(d.maisConcluido.treinamento) + ' · ' + d.maisConcluido.concluidos : '—') + '</b></span></div>' +
              '<div class="mini" style="cursor:default"><span class="dot s-BLOQUEADO" style="width:32px;height:32px">' + ic('alert') + '</span><span class="t"><span>Maior taxa de reprovação</span><b>' +
                (d.maiorReprovacao ? esc(d.maiorReprovacao.treinamento) + ' · ' + d.maiorReprovacao.taxaReprovacao + '% das tentativas' : 'Nenhuma reprovação') + '</b></span></div>' +

        '<div class="grid two">' +
          '<section class="card panel"><div class="panel-h"><h3>Ainda não iniciaram</h3><span class="pill s-BLOQUEADO">' + d.naoIniciaram.length + '</span></div>' + lista(d.naoIniciaram, 'Todos já começaram. 👏') + '</section>' +

  function relatorio(el, u) {
    H.carregando(el);
    filtros().then(function (f) {
      var opt = function (lista, val, txt) { return lista.map(function (x) { return '<option value="' + esc(val(x)) + '">' + esc(txt(x)) + '</option>'; }).join(''); };
      el.innerHTML =

          '<div class="field"><label>Colaborador</label><input class="input" name="colaborador" placeholder="Nome ou e-mail" list="dl-colab"><datalist id="dl-colab">' + opt(f.colaboradores, function (x) { return x.nome; }, function (x) { return x.email; }) + '</datalist></div>' +

        '<div class="card table-wrap" id="rel-tab"></div>';
      var dados = [];

      function buscar() {

  function baixarCsv(nome, linhas) {
    var csv = linhas.map(function (l) { return l.map(function (v) { v = String(v === null || v === undefined ? '' : v); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\r\n');
    try {
      var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { H.toast('Seu navegador bloqueou o download. Use "Gerar aba na planilha".', 'err'); }

  function acessos(el, u) {

          '<div class="table-wrap"><table class="t"><thead><tr><th>Colaborador</th><th>Departamento</th><th>Situação</th><th>Primeiro acesso</th><th>Último acesso</th><th class="num">Acessos</th></tr></thead><tbody>' +
          d.resumo.map(function (r) {
            var sit = !r.ativo ? '<span class="pill s-BLOQUEADO">Inativo</span>' : !r.senhaCriada ? '<span class="pill s-REVISAR">Sem senha</span>' :
              r.diasSemAcesso === null ? '<span class="pill s-BLOQUEADO">Nunca entrou</span>' : '<span class="pill s-CONCLUIDO">Ativo</span>';
            return '<tr><td><b>' + esc(r.nome) + '</b><div class="muted small">' + esc(r.email) + '</div></td><td>' + esc(r.departamento) + '</td><td>' + sit + '</td>' +
              '<td>' + esc(r.primeiroAcesso || '—') + '</td><td>' + esc(r.ultimoAcesso || '—') + (r.diasSemAcesso !== null ? '<div class="muted small">' + (r.diasSemAcesso === 0 ? 'hoje' : r.diasSemAcesso === 1 ? 'ontem' : 'há ' + r.diasSemAcesso + ' dias') + '</div>' : '') + '</td>' +
              '<td class="num">' + r.totalAcessos + '</td>' +
              '' + '</tr>';
          }).join('') + '</tbody></table></div></section>' +
          '<section class="card panel"><div class="panel-h"><h3>Histórico de atividades</h3><span class="muted small">' + d.log.length + ' evento(s) mais recentes</span></div>' +
          (d.log.length ? '<div class="table-wrap" style="max-height:520px"><table class="t"><thead><tr><th>Data e hora</th><th>Colaborador</th><th>Evento</th><th>Detalhe</th></tr></thead><tbody>' +
            d.log.map(function (a) {
              return '<tr><td style="white-space:nowrap">' + esc(a.dataHora) + '</td><td><b>' + esc(a.nome || a.email) + '</b>' + (a.nome ? '<div class="muted small">' + esc(a.email) + '</div>' : '') + '</td>' +

            }).join('') + '</tbody></table></div>' : '<div class="empty">Nenhum evento para os filtros escolhidos.</div>') + '</section>';
      }, function (e) { H.erroNaTela(body, e); });

  function aprovacoes(el) {

      var html = '<div class="alert alert-info">' + ic('info') + '<div>Confirme que a pessoa é mesmo da Soltec antes de aprovar — principalmente em pedidos de <b>nova senha</b>, que dão acesso a uma conta existente. Ao reprovar, nada é criado nem alterado.</div></div>';

      html += d.pendentes.map(function (s) {
        return '<div class="card entrega" data-s="' + esc(s.id) + '"><div class="panel-h" style="margin-bottom:4px"><div><b>' + esc(s.nome) + '</b> <span class="muted small">· ' + esc(s.data) + '</span>' +
          '<div class="muted small">' + esc(s.email) + ' · ' + esc(nomeTipo(s)) + (s.departamento ? ' · ' + esc(s.departamento) : '') + '</div></div>' + pill('PENDENTE') + '</div>' +
          (s.tipo === 'CADASTRO' && !s.jaCadastrado ?
            '<div class="filters" style="grid-template-columns:1fr 1fr;box-shadow:none;border:0;padding:8px 0"><div class="field"><label>Departamento</label><input class="input" data-dep value="' + esc(s.departamento) + '"></div>' +
            '<div class="field"><label>Perfil</label><select class="input" data-perfil>' + d.perfis.map(function (p) { return '<option' + (p === 'COLABORADOR' ? ' selected' : '') + '>' + p + '</option>'; }).join('') + '</select></div></div>' : '') +
          '<div class="field"><label>Motivo (opcional — aparece para a pessoa se você reprovar)</label><input class="input" data-motivo placeholder="Ex.: não identificamos este colaborador"></div>' +
          '<div style="display:flex;gap:8px"><button class="btn btn-ok btn-sm" data-ap="1">' + ic('check') + 'Aprovar</button><button class="btn btn-ghost btn-sm" data-ap="0">Reprovar</button></div></div>';
      }).join('');
      if (d.recentes.length) {
        html += '<section class="card panel" style="margin-top:20px"><div class="panel-h"><h3>Decisões recentes</h3></div><div class="table-wrap"><table class="t"><thead><tr><th>Pessoa</th><th>Pedido</th><th>Situação</th><th>Decidido por</th><th>Em</th><th>Motivo</th></tr></thead><tbody>' +
          d.recentes.map(function (s) {
            return '<tr><td><b>' + esc(s.nome) + '</b><div class="muted small">' + esc(s.email) + '</div></td><td>' + esc(nomeTipo(s)) + '</td><td>' + pill(s.status) + '</td><td>' + esc(s.decididoPor) + '</td><td>' + esc(s.dataDecisao) + '</td><td class="muted">' + esc(s.motivo) + '</td></tr>';
          }).join('') + '</tbody></table></div></section>';
      }
      el.innerHTML = html;
      $$('[data-ap]', el).forEach(function (b) {
        b.addEventListener('click', function () {
          var card = b.closest('[data-s]'), aprovar = b.getAttribute('data-ap') === '1';
          var dep = $('[data-dep]', card), perfil = $('[data-perfil]', card);
          var extra = { motivo: $('[data-motivo]', card).value, departamento: dep ? dep.value : undefined, perfil: perfil ? perfil.value : undefined };
          H.ocupado(b, H.api('apiAdminDecidirSolicitacao', card.getAttribute('data-s'), aprovar, extra))
            .then(function () { H.toast(aprovar ? 'Solicitação aprovada.' : 'Solicitação reprovada.', 'ok'); aprovacoes(el); }, function (e) { H.toast(e.message, 'err'); });
        });
      });
      var bd = $('#bdg-apr'); if (bd) { bd.textContent = d.pendentes.length; bd.classList.toggle('hidden', !d.pendentes.length); }
    }, function (e) { H.erroNaTela(el, e); });
  }

  
  function atividades(el) {
    H.carregando(el);
    H.api('apiAdminEntregas').then(function (l) {
      if (!l.length) { el.innerHTML = '<div class="card empty">' + ic('check') + '<p>Nenhuma atividade aguardando avaliação.</p></div>'; return; }
      el.innerHTML = l.map(function (e) {
        return '<div class="card entrega" data-e="' + esc(e.id) + '"><div class="panel-h" style="margin-bottom:4px"><div><b>' + esc(e.nome) + '</b> <span class="muted small">· ' + esc(e.data) + '</span>' +
          '<div class="muted small">' + esc(e.atividade) + '</div></div>' + H.pill('PENDENTE_AVALIACAO') + '</div>' +
          (e.resposta ? '<pre>' + esc(e.resposta) + '</pre>' : '') +
          (e.link ? '<p style="margin:6px 0 12px"><a href="' + esc(e.link) + '" target="_blank" rel="noopener">' + ic('ext') + ' ' + esc(e.link) + '</a></p>' : '') +
          '<div class="field"><label>Comentário para o colaborador (opcional)</label><input class="input" data-fb placeholder="Feedback"></div>' +
          '<div style="display:flex;gap:8px"><button class="btn btn-ok btn-sm" data-av="1">' + ic('check') + 'Aprovar</button><button class="btn btn-ghost btn-sm" data-av="0">Devolver para ajustes</button></div></div>';
      }).join('');
      $$('[data-av]', el).forEach(function (b) {
        b.addEventListener('click', function () {
          var card = b.closest('[data-e]');
          H.ocupado(b, H.api('apiAdminAvaliarEntrega', card.getAttribute('data-e'), b.getAttribute('data-av') === '1', $('[data-fb]', card).value))
            .then(function () { card.remove(); H.toast('Avaliação registrada.', 'ok'); if (!$('[data-e]', el)) atividades(el); }, function (e) { H.toast(e.message, 'err'); });
        });
      });
    }, function (e) { H.erroNaTela(el, e); });
  }

  
  function presenca(el) {
    H.carregando(el);
    Promise.all([H.api('apiAdminPresencaConteudos'), filtros()]).then(function (r) {
      var cont = r[0], f = r[1];
      if (!cont.length) {
        el.innerHTML = '<div class="card empty">' + ic('pin') + '<p>Nenhum conteúdo de presença cadastrado.</p><p class="small">Para registrar presença em um encontro, cadastre na aba CONTEUDOS um item do tipo <b>PRESENCIAL</b> (critério PRESENCA).</p></div>';
        return;
      }
      el.innerHTML = '<div class="card panel" style="max-width:720px"><div class="field"><label>Encontro / conteúdo</label><select class="input" id="pr-c">' +
        cont.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.treinamento + ' — ' + c.titulo) + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label>Participantes <button type="button" class="btn-link small" id="pr-todos">marcar todos</button></label><div class="check-list">' +
        f.colaboradores.map(function (c) { return '<label><input type="checkbox" value="' + esc(c.email) + '"><span><b>' + esc(c.nome) + '</b> <span class="muted small">' + esc(c.email) + '</span></span></label>'; }).join('') +
        '</div></div><button class="btn btn-primary" id="pr-ok">' + ic('check') + 'Registrar presença</button></div>';
      $('#pr-todos', el).addEventListener('click', function () { $$('.check-list input', el).forEach(function (i) { i.checked = true; }); });
      $('#pr-ok', el).addEventListener('click', function () {
        var emails = $$('.check-list input:checked', el).map(function (i) { return i.value; });
        if (!emails.length) return H.toast('Selecione ao menos um participante.', 'err');
        H.ocupado(this, H.api('apiAdminRegistrarPresenca', $('#pr-c', el).value, emails)).then(function (n) {
          H.toast('Presença registrada para ' + n + ' colaborador(es).', 'ok');
          $$('.check-list input', el).forEach(function (i) { i.checked = false; });
        }, function (e) { H.toast(e.message, 'err'); });
      });
    }, function (e) { H.erroNaTela(el, e); });
  }
})(Hub);
</script>

  <script>Hub.iniciar();</script>
</body>
</html>
